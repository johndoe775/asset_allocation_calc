name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Environment MUST be created in Settings first
    environment:
      name: github-pages
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Inject GitHub Secrets into index.html
        run: |
          sed -i 's|__CLOUDFLARE_WORKER_URL__|${{ secrets.CLOUDFLARE_WORKER_URL }}|g' index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    
    # Output URL captured separately
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}